<!DOCTYPE html>
<title>Login</title>
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #eee; font-family: sans-serif; }
  form { background: white; padding: 20px; border-radius: 5px; display: flex; flex-direction: column; width: 250px; }
  input, button { margin: 8px 0; padding: 10px; border-radius: 3px; border: 1px solid #ccc; }
  button { background: #007bff; color: white; border: none; cursor: pointer; }
</style>

<form action="/login" method="POST">
  <h2 style="text-align:center; margin:0 0 10px 0">Login</h2>
  <input type="text" placeholder="Username" required>
  <input type="password" placeholder="Password" required>
  <button type="submit">Sign In</button>
</form>
